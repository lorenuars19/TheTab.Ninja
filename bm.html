<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheTab.Ninja</title>
    <link rel="stylesheet" href="bm.css">
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" />

</head>
<body> 
    
    <div id="leftPane">
       
        <div class="pane-toggle" id="toggleLeftPane" title="Open/Close settings">
            <i class="fa fa-bars"></i>
           
        </div>
        
        <div id="settings">        
            <a href="https://kodar.ninja" target="_blank">Created by Kodar.Ninja</a>
            <br>
            <h3>Settings</h3>
            <label>
                <input type="checkbox" id="openInNewTab"> Open links in new tab
            </label>
            <br>
            <label>
                <input type="checkbox" id="darkMode"> Dark mode
            </label>
            <h3>GitHub Sync Settings</h3>
            
            <input type="text" id="githubUsername" placeholder="GitHub Username">
            <input type="text" id="githubRepo" placeholder="Repository Name">
            <input type="password" id="githubPat" placeholder="Personal Access Token">
            <div class="help-link-container">
                <a href="/github-setup-guide.html" target="_blank" class="help-link">
                    <i class="fas fa-question-circle"></i>
                   ❓ How do I create a GitHub Personal Access Token?
                </a>
            </div>
            
            <hr>
            <h3>Import/Export</h3>
            <button id="exportButton" class="import-button">Export Bookmarks</button>
            <label for="importFile" class="import-button">
                <input type="file" id="importFile" accept=".json" style="display:none;">
                Import Bookmarks 
            </label>
            <label for="importTobyFile" class="import-button">
                <input type="file" id="importTobyFile" accept=".json" style="display:none;">
                Import Toby data (JSON)
            </label>

            <button id="deleteAllButton" class="import-button delete-button">Delete All</button> <!-- Ny knapp -->
            <br><br>
            <hr>
            
            <br>
            <div id="mysettings">
                <h3>Wallpaper</h3>
                <div id="backgroundThumbnails">                    
                    <!-- Miniatyrer kommer att genereras här med JavaScript -->
                </div>
            </div>
            <br>
            <div id="versionDisplay"></div>
            </div>            
        </div>
    </div>
    <div id="bookmarkManager">
        <div id="topBar">
            <button id="syncButton" style="display: none;">
                <i class="fa fa-refresh"></i>
            </button>
            <button id="addCollection">Add Collection</button>     
            <input type="text" id="searchBox" placeholder="Search Collections/Bookmarks (#collections, %all, |or) #blue|red">
            <a href="https://buymeacoffee.com/kodar.ninja" target="_blank" id="supportButton">Support dev with a ☕</a>
        </div>
        <div id="collections"></div>
    </div>
    <div id="rightPane">
        <div class="pane-toggle" id="toggleRightPane" title="Open/Close Chrome Tabs-list">
            <i class="fa fa-bars"></i>
        </div>        
        <div id="content"></div>
    </div>
    
    <script src="bm.js"></script>    
</body>
</html>
